name: jalada

x-backend-environment: &backend-environment
  JALADA_ENVIRONMENT: ${JALADA_ENVIRONMENT:-development}
  JALADA_LOG_LEVEL: ${JALADA_LOG_LEVEL:-INFO}
  JALADA_DATABASE_URL: postgresql+psycopg://jalada:${POSTGRES_PASSWORD:-jalada}@postgres:5432/jalada
  # Local compose serves plain HTTP, where browsers drop Secure cookies.
  JALADA_COOKIE_SECURE: "false"
  JALADA_PUBLIC_URL: http://localhost:3000
  JALADA_GOOGLE_CLIENT_ID: ${JALADA_GOOGLE_CLIENT_ID:-}
  JALADA_GOOGLE_CLIENT_SECRET: ${JALADA_GOOGLE_CLIENT_SECRET:-}
  JALADA_STORAGE_ENDPOINT_URL: http://storage:8333
  JALADA_STORAGE_ACCESS_KEY: jalada
  JALADA_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-jalada-local-secret}
  # A fixed key for local data only. Production keys come from the host's secret settings.
  JALADA_EVIDENCE_KEYS: ${JALADA_EVIDENCE_KEYS:-bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTMyLWJ5dGVzISE=}
  JALADA_MODEL_PROVIDER: ${JALADA_MODEL_PROVIDER:-none}
  JALADA_MODEL_NAME: ${JALADA_MODEL_NAME:-}
  JALADA_GEMINI_API_KEY: ${JALADA_GEMINI_API_KEY:-}
  JALADA_OLLAMA_URL: http://ollama:11434
  JALADA_TELEGRAM_BOT_TOKEN: ${JALADA_TELEGRAM_BOT_TOKEN:-}
  JALADA_TELEGRAM_BOT_USERNAME: ${JALADA_TELEGRAM_BOT_USERNAME:-}
  JALADA_TELEGRAM_WEBHOOK_SECRET: ${JALADA_TELEGRAM_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jalada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jalada}
      POSTGRES_DB: jalada
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jalada"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.52
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "jalada-migrate && jalada-setup-storage"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *backend-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../apps/web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional Telegram bot by polling, for local work: make up-telegram.
  telegram:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: ["telegram"]
    command: ["jalada-telegram", "poll"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional local language model: make up-ollama, then make ollama-model.
  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  storage-data:
  ollama-data:
