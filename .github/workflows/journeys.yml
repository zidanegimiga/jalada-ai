name: Journeys

# The main journey in a real browser, against the whole stack built from this commit.
on:
  pull_request:
    paths: &journey-paths
      - "apps/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/journeys.yml"
  push:
    branches: [main]
    paths: *journey-paths

permissions:
  contents: read

env:
  COMPOSE: docker compose -p jalada-e2e -f infra/docker-compose.yml

jobs:
  main-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: $COMPOSE up --build --detach --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - name: Show the stack's logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Keep the report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
