name: Web

on:
  pull_request:
    paths: &web-paths
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths: *web-paths

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Prerendering catches mistakes that tests and the type check do not.
      - run: npm run build
      - run: npm audit --omit=dev
