name: Python

on:
  pull_request:
    paths: &python-paths
      - "apps/api/**"
      - "apps/worker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths: *python-paths

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jalada
          POSTGRES_PASSWORD: jalada
          POSTGRES_DB: jalada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalada"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JALADA_TEST_DATABASE_URL: postgresql+psycopg://jalada:jalada@localhost:5432/jalada_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run --directory apps/api pytest
      - run: uv run --directory apps/worker pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-dev --no-emit-workspace --all-packages --format requirements-txt -o requirements.txt
      - run: uvx pip-audit --disable-pip --strict -r requirements.txt
