name: Python

on:
  pull_request:
    paths: &python-paths
      - "apps/api/**"
      - "apps/worker/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths: *python-paths

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jalada
          POSTGRES_PASSWORD: jalada
          POSTGRES_DB: jalada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalada"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JALADA_TEST_DATABASE_URL: postgresql+psycopg://jalada:jalada@localhost:5432/jalada_test
      JALADA_TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v7
      # Service containers cannot take a command, so S3 storage is started here.
      - name: Start S3 storage
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:4.52 server -s3 -dir=/data -ip.bind=0.0.0.0
          timeout 60 sh -c 'until curl -sf http://localhost:8333/healthz; do sleep 2; done'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Module boundaries (decision 0020)
        run: uv run lint-imports
      - run: uv run --directory apps/api pytest
      - run: uv run --directory apps/worker pytest
      - name: Pipeline evaluations
        run: uv run python evals/run_evals.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-dev --no-emit-workspace --all-packages --format requirements-txt -o requirements.txt
      - run: uvx pip-audit --disable-pip --strict -r requirements.txt
