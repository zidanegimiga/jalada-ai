[project]
name = "jalada"
version = "0.1.0"
description = "Jalada AI backend: domain rules, pipeline and HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
